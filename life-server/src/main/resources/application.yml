server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${life.datasource.driver-class-name}
    url: jdbc:mysql://${life.datasource.host}:${life.datasource.port}/${life.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${life.datasource.username}
    password: ${life.datasource.password}
  data:
    redis:
      host: ${life.redis.host}
      port: ${life.redis.port}
      password: ${life.redis.password}
      database: ${life.redis.database}

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.life.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      life:
        mapper: debug
        service: info
        controller: info

life:
  jwt:
    user-secret-key: tinkllos
    user-ttl: 7200000
    user-token-name: authentication
  #阿里云OSS
  aliyun:
    oss:
      endpoint: ${life.aliyun.oss.endpoint}
      access-key-id: ${life.aliyun.oss.access-key-id}
      access-key-secret: ${life.aliyun.oss.access-key-secret}
      bucket-name: ${life.aliyun.oss.bucket-name}
  wechat:
    appid: ${life.wechat.appid}
    secret: ${life.wechat.secret}
