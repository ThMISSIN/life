server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${life.datasource.driver-class-name}
    url: jdbc:mysql://${life.datasource.host}:${life.datasource.port}/${life.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${life.datasource.username}
    password: ${life.datasource.password}
  data:
    redis:
      host: ${life.redis.host}
      port: ${life.redis.port}
      password: ${life.redis.password}
      database: ${life.redis.database}
  rabbitmq:
    host: ${life.rabbitmq.host}
    port: ${life.rabbitmq.port}
    username: ${life.rabbitmq.username}
    password: ${life.rabbitmq.password}
    virtual-host: ${life.rabbitmq.vhost:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.life.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      life:
        mapper: debug
        service: info
        controller: info
  # 4.10 链路追踪: 日志行内嵌 traceId(HTTP过滤器生成/透传, MQ与定时任务见 MqTraceSupport/TaskLockSupport)
  pattern:
    level: "%5p [%X{traceId:-}]"

life:
  jwt:
    # 5.1 密钥外部化: 环境变量优先, 默认值仅供本地开发(生产必须注入 LIFE_JWT_* 并轮换)
    user-secret-key: ${LIFE_JWT_USER_SECRET:life-social-user-jwt-secret-2026-change-me-please}
    user-ttl: 7200000
    user-token-name: authentication
    # 2.3 管理端令牌: 与C端密钥分离(互不可用), 默认请求头 admin-authentication
    admin-secret-key: ${LIFE_JWT_ADMIN_SECRET:life-social-admin-jwt-secret-2026-change-me-please}
    admin-ttl: 7200000
    admin-token-name: admin-authentication
  # Python AI Agent 伴生服务（绑定 AgentProperties: prefix=life.agent）
  agent:
    enabled: true
    base-url: http://127.0.0.1:8000/api/v1
    # 需与 life-agent 的 AGENT_INTERNAL_TOKEN 一致；空=本地不校验（生产务必设置）
    internal-token: ""
    connect-timeout-seconds: 5
    read-timeout-seconds: 120
  #阿里云OSS（绑定 AliOssProperties: prefix=life.aliyun, 真实值在 dev 配置 life.alioss.*）
  aliyun:
    endpoint: ${life.alioss.endpoint}
    access-key-id: ${life.alioss.access-key-id}
    access-key-secret: ${life.alioss.access-key-secret}
    bucket-name: ${life.alioss.bucket-name}
  #图片存储通道: local-本地磁盘(默认, 项目自带 AK 已被云端禁用) / oss-阿里云
  storage:
    type: local
  local-storage:
    base-path: uploads
  # 积分业务参数(2.5 抵扣 / 1.6 榜单结算 / 2.8 过期 / 2026-11-12 发帖奖励与消费返积分):
  # rate=多少积分抵1元; max-ratio=抵扣上限占订单金额百分比;
  # rank-rewards=月度积分榜前三名奖励(逗号分隔, 按名次取用);
  # expire-days=发放积分有效期天数, 0=永久(默认), >0 时正向流水写 expire_time 由 PointsExpireTask 到期回收;
  # post-reward=发帖奖励积分(MQ异步, bizNo=POST:{id} 幂等), post-reward-daily-limit=每人每日限发篇数(防刷);
  # rebate=消费力度返积分: 支付成功按 实付元×points-per-yuan + 达档阶梯加赠(tiers "门槛元:加赠分" 累加) 同步入账,
  #   退款按同公式冲回(min(返额,余额)); 例 实付300元 → 300 + 20 + 50 + 200 = 570 分
  points:
    deduct:
      rate: 100
      max-ratio: 50
    rank-rewards: 100,50,20
    expire-days: 0
    post-reward: 10
    post-reward-daily-limit: 3
    rebate:
      enabled: true
      points-per-yuan: 1
      tiers: "50:20,100:50,300:200"
  # 签到分值(2026-11-12 提高): 基础分 + 连签7/14/28天里程碑奖励, 运营可调无需发版
  sign:
    base-points: 5
    reward-7: 30
    reward-14: 60
    reward-28: 150
  # 订单: 发货后自动确认收货天数(定时任务 OrderAutoConfirmTask)
  order:
    auto-confirm-days: 7
    # 2.5 超时未支付自动关单分钟数(延迟消息TTL与扫描兜底共用)
    auto-close-minutes: 30
  # 2.10 风控: 滑动窗口限频(次/窗口秒) + 命中标记时长; windows 未配置的动作不限频;
  # map键用 "[...]" 包裹保留大写动作名(宽松绑定会小写化裸键)
  risk:
    enabled: true
    flag-ttl-minutes: 10
    windows:
      "[SIGN]": { seconds: 60, limit: 3 }
      "[POST]": { seconds: 60, limit: 5 }
      "[COMMENT]": { seconds: 60, limit: 10 }
      "[LIKE]": { seconds: 60, limit: 30 }
      "[VIEW]": { seconds: 60, limit: 60 }
      "[CLAIM]": { seconds: 60, limit: 10 }
      "[ORDER]": { seconds: 60, limit: 5 }
  # 2.10 接口层 Sentinel 单机限流(无dashboard, 规则代码化): key=URL pattern, value=单用户QPS;
  # 资源总QPS熔断线=单用户阈值×20(见 SentinelRuleConfig);
  # 注意: map键必须用 "[...]" 包裹, 否则 Spring 宽松绑定会剥掉斜杠导致资源名匹配不上
  sentinel:
    enabled: true
    rules:
      "[/post/page]": 10
      "[/post/publish]": 5
      "[/post/{id}/view]": 20
      "[/like]": 10
      "[/order]": 5
      "[/signRecord]": 3
  # 2.11 ES 全文检索(应用双写同步, 不用Canal): enabled=false 或连接异常自动降级 SQL LIKE
  es:
    enabled: true
    uri: http://172.27.216.62:9200
    post-index: life_post
    timeout-ms: 2000
  # 2.14 Redis+Lua 库存镜像: Lua预扣挡热点流量, DB条件扣减仍是权威; 对账任务10分钟校正漂移
  stock:
    enabled: true
    preheat-on-demand: true
    cache-ttl-hours: 72
    reconcile-interval-minutes: 10
  # 热度推荐信息流(2.11): hot=公式参数(单语句重算, 调参后由扫描任务自然收敛) /
  # feed=多级缓存与阅读回写 / bloom=帖子id布隆过滤器(防穿透)
  post:
    hot:
      base-text: 20
      base-image: 10
      base-title: 5
      weight-like: 3
      weight-comment: 2
      weight-repost: 4
      weight-view: 0.1
      new-post-boost: 80
      new-post-hours: 24
      decay-per-hour: 0.5
      decay-max: 300
      recalc-window-hours: 72
      recalc-batch-size: 800
    feed:
      cache-enabled: true
      redis-ttl-seconds: 30
      caffeine-ttl-seconds: 10
      caffeine-max-pages: 200
      view-drain-batch-size: 50
    bloom:
      expected-ids: 1000000
      fpp: 0.01
      rebuild-on-start: true
      rebuild-batch-size: 5000
  wechat:
    appid: ${life.wechat.appid}
    secret: ${life.wechat.secret}
