server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${life.datasource.driver-class-name}
    url: jdbc:mysql://${life.datasource.host}:${life.datasource.port}/${life.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${life.datasource.username}
    password: ${life.datasource.password}
  data:
    redis:
      host: ${life.redis.host}
      port: ${life.redis.port}
      password: ${life.redis.password}
      database: ${life.redis.database}
  rabbitmq:
    host: ${life.rabbitmq.host}
    port: ${life.rabbitmq.port}
    username: ${life.rabbitmq.username}
    password: ${life.rabbitmq.password}
    virtual-host: ${life.rabbitmq.vhost:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.life.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      life:
        mapper: debug
        service: info
        controller: info

life:
  jwt:
    user-secret-key: tinkllos
    user-ttl: 7200000
    user-token-name: authentication
  #阿里云OSS（绑定 AliOssProperties: prefix=life.aliyun, 真实值在 dev 配置 life.alioss.*）
  aliyun:
    endpoint: ${life.alioss.endpoint}
    access-key-id: ${life.alioss.access-key-id}
    access-key-secret: ${life.alioss.access-key-secret}
    bucket-name: ${life.alioss.bucket-name}
  #图片存储通道: local-本地磁盘(默认, 项目自带 AK 已被云端禁用) / oss-阿里云
  storage:
    type: local
  local-storage:
    base-path: uploads
  wechat:
    appid: ${life.wechat.appid}
    secret: ${life.wechat.secret}
